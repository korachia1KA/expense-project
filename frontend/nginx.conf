# =====================================================================================
# nginx config used INSIDE the frontend Docker image (see Dockerfile).
# nginx does two jobs:
#   1. serves the compiled Angular files (index.html, JS, CSS) as static files;
#   2. forwards ("reverse-proxies") API calls to the Spring Boot container.
# Because the browser only ever talks to this one origin, no CORS setup is needed in Docker.
# =====================================================================================
server {
    # Port inside the container; docker-compose maps host port 8092 to it.
    listen 80;
    # Where the Dockerfile copied the Angular build output.
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (JS/CSS/JSON) so pages load faster.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Forward the REST API and the Swagger docs to the backend.
    # "backend" is the service name in docker-compose.yml; Docker's internal DNS resolves it.
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        # Pass along the original host and client IP (useful for logs).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built JS/CSS files have a content hash in their name (main-AB12CD.js), so they can be
    # cached "forever": a new build produces new file names.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: a path such as /transactions/5/edit is an Angular route, not a file on disk.
    # Serve index.html and let the Angular router display the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
