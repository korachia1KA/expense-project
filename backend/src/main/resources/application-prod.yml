# =====================================================================================
# "prod" profile. Activated with SPRING_PROFILES_ACTIVE=prod (docker-compose does this).
# Values here OVERRIDE application.yml; everything not mentioned is inherited from it.
#
# Every setting reads an environment variable with a fallback: ${NAME:default}.
# This follows the "12-factor app" rule: configuration lives in the environment, not in code,
# so the same jar runs locally, in Docker, on Render or on Railway.
# =====================================================================================
server:
  # Inside a container the port can be anything; 8080 is the convention (nginx proxies to it).
  # Hosting platforms such as Render/Railway inject PORT, so we honour it when present.
  port: ${PORT:8080}

spring:
  datasource:
    # PostgreSQL connection. "db" is the service name from docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expensetracker}
    username: ${DB_USERNAME:expensetracker}
    password: ${DB_PASSWORD:expensetracker}
  h2:
    console:
      # Never expose a database console in production.
      enabled: false

app:
  # Keep the demo account so reviewers can log in to a deployed instance; set false for real use.
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cors:
    # Comma-separated list of allowed browser origins, e.g. https://my-frontend.onrender.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}
